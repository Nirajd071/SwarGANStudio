name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps CI fast and avoids CUDA wheels.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Runtime deps needed by the test suite (excludes heavy/optional
          # tooling like demucs/streamlit that the tests don't exercise).
          pip install numpy scipy librosa soundfile pyworld matplotlib \
                      fastapi "uvicorn[standard]" python-multipart
          # Dev/test deps.
          pip install pytest httpx ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q
